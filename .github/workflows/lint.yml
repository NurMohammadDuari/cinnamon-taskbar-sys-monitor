name: 🕯️ Validate applet

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate JSON / JS / bindings
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node (SpiderMonkey-compatible syntax check)
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run offline validation suite
        run: python3 tests/validate.py
      - name: Shell scripts must be parseable
        run: |
          bash -n install.sh && echo "✅ install.sh parses"
          bash -n uninstall.sh && echo "✅ uninstall.sh parses"
