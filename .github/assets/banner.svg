<svg xmlns="http://www.w3.org/2000/svg" width="820" height="240" viewBox="0 0 820 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12161f"/>
      <stop offset="1" stop-color="#1d2942"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="820" height="240" rx="16" fill="url(#bg)"/>
  <!-- fake taskbar -->
  <rect x="40" y="168" width="740" height="40" rx="8" fill="#2b2f36"/>
  <circle cx="66" cy="188" r="10" fill="#5683f5"/>
  <rect x="88" y="179" width="150" height="18" rx="4" fill="#3a3f47"/>
  <rect x="500" y="184" width="250" height="12" rx="3" font-family="monospace" font-size="14" fill="url(#acc)" text-anchor="middle">
  </rect>
  <text x="625" y="196" font-family="monospace" font-size="15" fill="#4ade80" text-anchor="middle">CPU 100% MEM 4.8G ▼4G ▲54K</text>
  <!-- popup card -->
  <rect x="520" y="66" width="260" height="92" rx="10" fill="#181a1b" stroke="#3f444d"/>
  <text x="540" y="90" font-family="sans-serif" font-size="12" font-weight="bold" fill="#e8eaed">Interface: enp2s0 (Ethernet)</text>
  <line x1="530" y1="98" x2="770" y2="98" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="540" y="116" font-family="sans-serif" font-size="11" fill="#b8bcbe">Download speed</text>
  <text x="630" y="116" font-family="monospace" font-size="11" fill="#f2f2f2">219.76 KB/s</text>
  <text x="540" y="132" font-family="sans-serif" font-size="11" fill="#b8bcbe">Upload speed</text>
  <text x="630" y="132" font-family="monospace" font-size="11" fill="#f2f2f2">3.59 KB/s</text>
  <text x="540" y="148" font-family="sans-serif" font-size="11" fill="#b8bcbe">Max speed</text>
  <text x="630" y="148" font-family="monospace" font-size="11" fill="#f2f2f2">100 Mb/s</text>
  <!-- title -->
  <text x="40" y="66" font-family="sans-serif" font-size="38" font-weight="bold" fill="#f2f2f2">cinnamon-sysmon-text</text>
  <text x="40" y="98" font-family="sans-serif" font-size="17" fill="#9aa6b2">CPU · RAM · Network-speed readout for the Cinnamon taskbar</text>
  <rect x="40" y="112" width="430" height="4" rx="2" fill="url(#acc)"/>
  <text x="40" y="140" font-family="monospace" font-size="13" fill="#7f8b99">hover → netspeed-style popup · per-core CPU bars · zero deps</text>
</svg>
