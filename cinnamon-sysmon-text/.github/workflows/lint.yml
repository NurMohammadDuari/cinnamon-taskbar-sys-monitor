name: 🕯️ Validate applet

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    name: applet.js syntax check (Cinnamon/GJS)
    steps:
      - uses: actions/checkout@v4
      - name: node --check (GJS is SpiderMonkey)
        run: |
          node --check "sysmon-text@win11/applet.js"
          echo "✅ applet.js parses cleanly (SpiderMonkey-compatible)"
